function migrateKeys(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  let out = null;
  for (const k in obj) {
    const m = /^תמיד\|\|(\d+)\|\|(.)$/.exec(k);
    if (m && +m[1] >= 2 && +m[1] <= 10) {
      if (!out) out = { ...obj };
      const nk = amudKey('תמיד', +m[1] + 23, m[2]);
      if (!(nk in out)) out[nk] = out[k];
      delete out[k];
    }
  }
  return out || obj;
}

// לעולם לא מוחק סימון — כך שסימון שנעשה במכשיר אחר לא נעלם. מחזיר null אם אין שינוי.
function mergeInto(local, server) {
  if (!server || typeof server !== 'object') return null;
  let changed = false;
  const out = { ...local };
  for (const k in server) {
    if (!(k in out)) { out[k] = server[k]; changed = true; }
    else if (typeof server[k] === 'number' && typeof out[k] === 'number' && server[k] > out[k]) { out[k] = server[k]; changed = true; }
  }
  return changed ? out : null;
}

// מחשב את יום ההולדת העברי שבו מגיעים לגיל age (שנה עברית של הלידה + age)
function hebrewBirthdayAtAge(birthDate, age) {
  try {
    const hebcal = window.Hebcal || window.hebcal;
    if (!hebcal) return null;
    const { HDate } = hebcal;
    const birthHeb = new HDate(birthDate);
    const year = birthHeb.getFullYear() + Number(age);
    let month = birthHeb.getMonth();
    const ADAR_I = 12, ADAR_II = 13;
    const leap = HDate.isLeapYear(year);
    if (!leap && month === ADAR_II) month = ADAR_I;               // אדר ב׳ בשנה פשוטה → אדר
    else if (leap && month === ADAR_I && !HDate.isLeapYear(birthHeb.getFullYear())) month = ADAR_II; // נולד באדר פשוט → אדר ב׳
    const day = Math.min(birthHeb.getDate(), HDate.daysInMonth(month, year)); // ל׳ חשוון/כסלו בשנה חסרה
    const bday = new HDate(day, month, year);
    return { hebrew: bday.renderGematriya ? bday.renderGematriya(true) : bday.render('he'), gregorian: bday.greg() };
  } catch(e) { return null; }
}

async function sefariaJson(path) {
  const url = SEFARIA + path;

function cleanSefariaHtml(v) {
  const s = Array.isArray(v) ? v.flat(Infinity).filter(Boolean).join(' ') : (v || '');
  const doc = new DOMParser().parseFromString('<div>' + s + '</div>', 'text/html');
  const root = doc.body.firstChild;
  root.querySelectorAll('.footnote, .footnote-marker, sup, script, style').forEach(el => el.remove());
  const KEEP = { B:1, STRONG:1, I:1, EM:1, BR:1, SMALL:1, BIG:1 };
  const walk = el => {
    for (const ch of Array.from(el.children)) {
      walk(ch);
      if (KEEP[ch.tagName]) { for (const a of Array.from(ch.attributes)) ch.removeAttribute(a.name); }
      else ch.replaceWith(...ch.childNodes);
    }
  };
  walk(root);

async function loadAmud(book, amud) {

    sefariaJson('v3/texts/Steinsaltz_on_' + book + '.' + amud + '?version=hebrew').catch(() => null),

  const st = ((s && s.versions && s.versions[0] && s.versions[0].text) || []).map(cleanSefariaHtml);

function Reader({ tractate, bookmark, onPos, onStop, learned, onToggleAmud, onClose }) {

          style={{ ...btn, background: isStop ? '#e8c040' : btn.background, color: isStop ? '#1a2340' : btn.color, fontWeight:700 }}>

        </button>

      {err && <div style={{ background:'#fef3c7', color:'#92400e', fontSize:'0.82rem', padding:'0.5rem 1rem', textAlign:'center' }}>
        {err} {!range && <span onClick={init} style={{ textDecoration:'underline', cursor:'pointer', fontWeight:700 }}>נסה שוב</span>}
      </div>}

      {/* גמרא */}
      <div ref={topRef} onScroll={onTopScroll} style={{ flex: stOpen ? '1 1 52%' : '1 1 100%', overflowY:'auto', padding:'0.8rem 1rem 2rem', WebkitOverflowScrolling:'touch' }}>
        {!range && !err && <div style={{ textAlign:'center', color:'#7a8aaa', padding:'3rem 0' }}>טוען מספריא...</div>}
        {range && !atStart && <div style={{ textAlign:'center', marginBottom:'0.6rem' }}>
          <button onClick={loadPrev} disabled={busy} style={{ background:'#eef2f9', border:'none', borderRadius:99, color:'#3d5499', fontSize:'0.78rem', fontWeight:600, padding:'0.3rem 0.9rem', cursor:'pointer', fontFamily:"'Heebo',sans-serif" }}>▲ עמוד קודם</button>
        </div>}
        {shown.map(a => (
          <div key={a}>
            <div style={{ textAlign:'center', color:'#8a6000', fontFamily:"'Frank Ruhl Libre',serif", fontWeight:700, fontSize:'0.95rem', margin:'0.4rem 0 0.5rem', letterSpacing:'0.02em' }}>— {amudLabel(a)} —</div>
            <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize: font + 'rem', lineHeight:2, textAlign:'justify', color:'#1a2340' }}>
              {segsOf(a).map(k => {
                const key = a + ':' + k, on = key === active, stop = key === stopKey;
                return (
                  <span key={key} ref={el => { segEls.current[key] = el; }} onClick={() => activate(key, false)}
                    style={{ background: on ? '#e3edfc' : stop ? '#fff4d6' : 'transparent', borderRadius:4, cursor:'pointer', transition:'background 0.2s', boxDecorationBreak:'clone', WebkitBoxDecorationBreak:'clone' }}>
                    {stop && <span aria-label="כאן עצרת" style={{ fontSize:'0.75em' }}>📍</span>}
                    <span dangerouslySetInnerHTML={{ __html: texts[a].gem[k - 1] }} />{' '}
                  </span>
                );
              })}
            </div>
            <div style={{ textAlign:'center', margin:'0.9rem 0 1.2rem' }}>
              <button onClick={() => toggleDone(a)} style={{ background: amudDone(a) ? '#1a7a50' : '#fff', color: amudDone(a) ? '#fff' : '#1a7a50', border:'1.5px solid #1a7a50', borderRadius:99, fontSize:'0.8rem', fontWeight:700, padding:'0.3rem 1rem', cursor:'pointer', fontFamily:"'Heebo',sans-serif" }}>
                {amudDone(a) ? '✓ ' + amudLabel(a) + ' סומן כנלמד' : 'סיימתי את ' + amudLabel(a) + ' — סמן כנלמד'}
              </button>
            </div>
          </div>
        ))}
        {range && atEnd && shown.length > 0 && <div style={{ textAlign:'center', color:'#8a6000', fontFamily:"'Frank Ruhl Libre',serif", fontWeight:700, padding:'1rem 0' }}>הדרן עלך {cfg.title}</div>}
        {busy && range && <div style={{ textAlign:'center', color:'#7a8aaa', fontSize:'0.8rem' }}>טוען...</div>}
      </div>

      {/* ביאור שטיינזלץ */}
      <button onClick={() => setStOpen(o => !o)} aria-expanded={stOpen}
        style={{ background:'#f1f1ef', border:'none', borderTop:'1px solid #dcdcd6', borderBottom: stOpen ? '1px solid #e6e6e0' : 'none', padding:'0.55rem 1rem', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.02rem', fontWeight:700, color:'#3a3a3a' }}>
        <span>ביאור שטיינזלץ</span><span style={{ fontSize:'0.8rem', color:'#888' }}>{stOpen ? '▼' : '▲'}</span>
      </button>
      {stOpen && <div ref={botRef} style={{ flex:'1 1 48%', overflowY:'auto', background:'#fafaf8', padding:'0.6rem 1rem 3rem', position:'relative', WebkitOverflowScrolling:'touch' }}>
        {shown.map(a => segsOf(a).map(k => {
          const key = a + ':' + k, html = texts[a].st[k - 1], on = key === active;
          if (!html) return null;
          return (
            <div key={key} ref={el => { stEls.current[key] = el; }} onClick={() => activate(key, true)}
              style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize: (font * 0.88) + 'rem', lineHeight:1.85, color: on ? '#1a2340' : '#5a6070', padding:'0.45rem 0.6rem', margin:'0 -0.6rem 0.2rem', borderRadius:8, borderRight: on ? '3px solid #4a67c8' : '3px solid transparent', background: on ? '#fff' : 'transparent', cursor:'pointer', textAlign:'justify' }}
              dangerouslySetInnerHTML={{ __html: html }} />
          );
        }))}
        <div style={{ fontSize:'0.68rem', color:'#9a9a9a', textAlign:'center', marginTop:'1.5rem', lineHeight:1.6, fontFamily:"'Heebo',sans-serif" }}>
          הטקסט מספריא (Sefaria) · תלמוד מהדורת William Davidson · ביאור הרב עדין שטיינזלץ · CC BY-NC
        </div>
      </div>}
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [learned, setLearned] = useState({});
  const [journal, setJournal] = useState([]);
  const [openCards, setOpenCards] = useState({});
  const [search, setSearch] = useState('');
  const [flash, setFlash] = useState(null);
  const [tab, setTab] = useState('shas');
  const [newEntry, setNewEntry] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  const [quoteOpen, setQuoteOpen] = useState(false);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  const [offlineView, setOfflineView] = useState(false); // מצב צפייה-בלבד מ-localStorage כשאין רשת
  const [rangeState, setRangeState] = useState({});
  const [sinaiOpen, setSinaiOpen] = useState({});
  const [sinaiOpenedCard, setSinaiOpenedCard] = useState({});
  const [reviews, setReviews] = useState({});
  const [reviewsMode, setReviewsMode] = useState({});
  const reviewsRef = useRef({});
  useEffect(() => { reviewsRef.current = reviews; }, [reviews]);
  const [backupMsg, setBackupMsg] = useState(null);
  const [streakData, setStreakData] = useState(null);
  const streakRef = useRef(null);
  useEffect(() => { streakRef.current = streakData; }, [streakData]);
  const [notes, setNotes] = useState({});
  const notesRef = useRef({});
  useEffect(() => { notesRef.current = notes; }, [notes]);
  const [hard, setHard] = useState({});
  // מסך עיון: סימניות לכל מסכת — { last: '21b:4' (אוטומטי), stop: '23a:2' (📍 ידני), updated }
  const [readerMarks, setReaderMarks] = useState({});
  const readerMarksRef = useRef({});
  const readerSaveT = useRef(null);
  const [readerOpen, setReaderOpen] = useState(null);
  const [hardMode, setHardMode] = useState({});
  const hardRef = useRef({});
  useEffect(() => { hardRef.current = hard; }, [hard]);
  const [targetDate, setTargetDate] = useState(null);
  const [targetInput, setTargetInput] = useState('');
  const [ageInput, setAgeInput] = useState('');
  const [birthInput, setBirthInput] = useState('');
  const learnedRef = useRef({});
  useEffect(() => { learnedRef.current = learned; }, [learned]);
  // מגן מפני דריסת נתוני ענן בנתונים ריקים — שמירה אוטומטית רק אחרי שהטעינה הצליחה
  const dataLoadedRef = useRef(false);
  // שינויים מקומיים שעוד לא אושרו בשרת, לכל שדה (learned/reviews/hard). 0 = מסונכרן.
  // כשאין שינוי ממתין — השרת קובע (כך ביטול סימון במכשיר אחד עובר לשני ולא "חוזר").
  // כשיש שינוי ממתין — מיזוג union, כדי לא לאבד אף סימון.
  const pendingRef = useRef({ learned: 0, reviews: 0, hard: 0 });
  const seqRef = useRef(0);
  const refs = { learned: learnedRef, reviews: reviewsRef, hard: hardRef };
  function persist(field) {
    const seq = ++seqRef.current;
    pendingRef.current[field] = seq;
    if (!user || !dataLoadedRef.current || !navigator.onLine) return;
    fbSave(user.uid, 'shas-' + field, refs[field].current).then(ok => {
      if (ok && pendingRef.current[field] === seq) pendingRef.current[field] = 0;
    });
  }
  function flushPending(uid) {
    for (const f in pendingRef.current) {
      const seq = pendingRef.current[f];
      if (!seq) continue;
      fbSave(uid, 'shas-' + f, refs[f].current).then(ok => { if (ok && pendingRef.current[f] === seq) pendingRef.current[f] = 0; });
    }
  }

  useEffect(() => {
    if (!user) return;
    const uid = user.uid;
    const flushLearned = () => {
      if (!dataLoadedRef.current) return;
      flushPending(uid); // רק מה שלא נשמר — מכשיר שלא שינה כלום לא דורס את הענן
    };
    const onVisibility = () => {
      if (document.visibilityState === 'hidden') flushLearned();
    };
    window.addEventListener('pagehide', flushLearned);
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      window.removeEventListener('pagehide', flushLearned);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [user]);

  useEffect(() => {
    const handleOnline = () => {
      setIsOnline(true);
      if (user && dataLoadedRef.current) {
        flushPending(user.uid);
        if (streakRef.current) fbSave(user.uid, 'shas-streak', streakRef.current);
        if (Object.keys(notesRef.current).length) fbSave(user.uid, 'shas-notes', notesRef.current);
      }
    };
    const handleOffline = () => setIsOnline(false);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, [user]);

  useEffect(() => {
    const { auth, onAuthStateChanged, getRedirectResult } = window._fb;
    getRedirectResult(auth).catch(() => {});
    return onAuthStateChanged(auth, async u => {
      setUser(u);
      if (u) {
        // מאכלס את כל ה-state מתוך אובייקט נתונים (מהשרת או מהעותק המקומי)
        const hydrate = (data) => {
          try { setLearned(migrateKeys(data['shas-learned'] ? JSON.parse(data['shas-learned']) : {})); } catch(e) { setLearned({}); }
          try { setJournal(data['shas-journal'] ? JSON.parse(data['shas-journal']) : []); } catch(e) { setJournal([]); }
          try { setReviews(migrateKeys(data['shas-reviews'] ? JSON.parse(data['shas-reviews']) : {})); } catch(e) { setReviews({}); }
          try { const sd = data['shas-streak'] ? JSON.parse(data['shas-streak']) : null; setStreakData(sd); streakRef.current = sd; } catch(e) { setStreakData(null); }
          try { setNotes(data['shas-notes'] ? JSON.parse(data['shas-notes']) : {}); } catch(e) { setNotes({}); }
          try { const rm = data['shas-reader'] ? JSON.parse(data['shas-reader']) : {}; readerMarksRef.current = rm; setReaderMarks(rm); } catch(e) {}
          try { const hd = migrateKeys(data['shas-hard'] ? JSON.parse(data['shas-hard']) : {}); setHard(hd); hardRef.current = hd; } catch(e) { setHard({}); }
          if (data['shas-target']) {
            let raw = data['shas-target'];
            try {
              // יעדים ישנים חושבו בשנה העברית הלא נכונה — מחשבים מחדש מתאריך הלידה והגיל
              const o = JSON.parse(raw);
              if (o && o.birth && o.birth.length === 10 && o.age) {
                const b = hebrewBirthdayAtAge(parseLocalDate(o.birth), o.age);
                if (b) raw = JSON.stringify({ ...o, date: b.gregorian.toISOString(), hebrewLabel: b.hebrew });
              }
            } catch(e) {}
            setTargetDate(raw); setTargetInput(raw);
            try {
              const o = JSON.parse(raw);
              setAgeInput(String(o.age));
              const b = o.birth || '';
              setBirthInput(b.length === 7 ? b + '-01' : b);
            } catch(e) {}
          }
        };
        const data = await fbLoad(u.uid);
        if (data === null) {
          // טעינה מהשרת נכשלה (אין רשת/חסימה) — נציג עותק מקומי במצב צפייה-בלבד (בלי לכתוב לענן)
          dataLoadedRef.current = false;
          window._shasDataLoaded = false;
          let cached = null;
          try { cached = JSON.parse(localStorage.getItem('shas-fulldata') || 'null'); } catch(e) {}
          if (cached) {
            hydrate(cached);
            setOfflineView(true);
          } else {
            alert('⚠️ לא הצלחנו לטעון את הנתונים מהענן, ואין עותק מקומי במכשיר הזה.\n\nבדוק חיבור לאינטרנט (או VPN/סינון שחוסם את firestore.googleapis.com) ורענן את הדף.');
          }
          document.title = 'מעקב הש״ס · ' + (u.displayName || '');
          setLoading(false);
          return;
        }
        dataLoadedRef.current = true;
        window._shasDataLoaded = true;
        setOfflineView(false);
        hydrate(data);
        // עותקי שחזור מקומיים: learned בנפרד + כל הנתונים (לצפייה אופליין)
        try { if (data['shas-learned']) localStorage.setItem('shas-learned', data['shas-learned']); } catch(e) {}
        try { localStorage.setItem('shas-fulldata', JSON.stringify(data)); } catch(e) {}
        document.title = 'מעקב הש״ס · ' + (u.displayName || '');
      }
      setLoading(false);
    });
  }, []);

  // סנכרון חי בין מכשירים — כל שינוי שמאושר בשרת. מתעלם מכתיבות שלנו ומהמטמון.
  // אין שינוי מקומי ממתין → מצב השרת (כך גם ביטול סימון עובר). יש שינוי ממתין → union, לא מאבדים סימון.
  useEffect(() => {
    if (!user) return;
    const { db, doc, onSnapshot } = window._fb;
    const unsub = onSnapshot(doc(db, 'users', user.uid), snap => {
      if (!snap.exists() || snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
      if (!window._shasDataLoaded) return; // רק אחרי שהטעינה הראשונית הצליחה
      const d = snap.data();
      try {
        // סימניות עיון: לכל מסכת — הגרסה המעודכנת יותר מנצחת
        const srv = d['shas-reader'] ? JSON.parse(d['shas-reader']) : null;
        if (srv) {
          let changed = false; const nm = { ...readerMarksRef.current };
          for (const t in srv) if (!nm[t] || (srv[t].updated || 0) > (nm[t].updated || 0)) { nm[t] = srv[t]; changed = true; }
          if (changed) { readerMarksRef.current = nm; setReaderMarks(nm); }
        }
      } catch(e) {}
      const setters = { learned: setLearned, reviews: setReviews, hard: setHard };
      for (const f of ['learned', 'reviews', 'hard']) {
        try {
          const raw = d['shas-' + f];
          if (!raw) continue;
          const server = migrateKeys(JSON.parse(raw));
          if (!server || typeof server !== 'object') continue;
          const local = refs[f].current;
          let next = null;
          if (pendingRef.current[f]) next = mergeInto(local, server); // יש שינוי מקומי שטרם נשמר — לא מאבדים כלום
          else if (JSON.stringify(server) !== JSON.stringify(local)) next = server; // מסונכרן — מאמצים את מצב השרת (כולל ביטולי סימון)
          if (!next) continue;
          refs[f].current = next; setters[f](next);
          if (f === 'learned') { try { localStorage.setItem('shas-learned', JSON.stringify(next)); } catch(e){} }
        } catch(e){}
      }
    }, err => { console.warn('snapshot listener error', err); });
    return () => unsub();
  }, [user]);

  function signIn() {
    const { auth, provider, signInWithPopup, signInWithRedirect } = window._fb;
    signInWithPopup(auth, provider).catch(err => {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
        signInWithRedirect(auth, provider);
      }
    });
  }
  function signOutUser() { const { auth, signOut } = window._fb; signOut(auth); try { localStorage.removeItem('shas-fulldata'); localStorage.removeItem('shas-learned'); localStorage.removeItem('shas-reader'); } catch(e) {} readerMarksRef.current = {}; setReaderMarks({}); setReaderOpen(null); window._shasDataLoaded = false; dataLoadedRef.current = false; setLearned({}); setJournal([]); setReviews({}); setReviewsMode({}); setStreakData(null); setNotes({}); setHard({}); setHardMode({}); setTargetDate(null); setTargetInput(''); setAgeInput(''); setBirthInput(''); document.title = 'מעקב הש״ס'; }

  function setReaderMark(t, patch, immediate) {
    const nm = { ...readerMarksRef.current, [t]: { ...(readerMarksRef.current[t] || {}), ...patch, updated: Date.now() } };
    if (patch.stop === null) delete nm[t].stop;
    readerMarksRef.current = nm; setReaderMarks(nm);
    try { localStorage.setItem('shas-reader', JSON.stringify(nm)); } catch(e) {}
    clearTimeout(readerSaveT.current);
    const save = () => { if (user && navigator.onLine) fbSave(user.uid, 'shas-reader', readerMarksRef.current); };
    if (immediate) save(); else readerSaveT.current = setTimeout(save, 4000);
  }
  function closeReader() {
    if (readerSaveT.current) { clearTimeout(readerSaveT.current); readerSaveT.current = null; if (user && navigator.onLine) fbSave(user.uid, 'shas-reader', readerMarksRef.current); }
    setReaderOpen(null);
  }

  function toggleAmud(tractate, daf, amud) {
    const k = amudKey(tractate, daf, amud);
    const nl = { ...learned };
    if (nl[k]) { delete nl[k]; } else {
      nl[k] = true; setFlash(k); setTimeout(() => setFlash(null), 350);
      // עדכון רצף — רק בפעם הראשונה של היום
      const todayStr = todayDateStr();
      const sd = streakRef.current;
      if (!sd || sd.date !== todayStr) {
        const yd = new Date(); yd.setDate(yd.getDate() - 1);
        const yStr = yd.getFullYear() + '-' + String(yd.getMonth()+1).padStart(2,'0') + '-' + String(yd.getDate()).padStart(2,'0');
        const newCount = (sd && sd.date === yStr) ? (sd.count || 0) + 1 : 1;
        const nsd = { date: todayStr, count: newCount };
        streakRef.current = nsd;
        setStreakData(nsd);
        if (user && navigator.onLine) fbSave(user.uid, 'shas-streak', nsd);
      }
    }
    learnedRef.current = nl;
    setLearned(nl);
    try { localStorage.setItem('shas-learned', JSON.stringify(nl)); } catch(e) {}
    persist('learned');
  }

  function markAll(tractate, dafim) {
    const nl = { ...learned };
    for (const d of dafList(TRACTATE_BY_NAME[tractate])) { nl[amudKey(tractate,d,'א')] = true; nl[amudKey(tractate,d,'ב')] = true; }
    learnedRef.current = nl;
    setLearned(nl); persist('learned');
  }

  function unmarkAll(tractate, dafim) {
    const nl = { ...learned };
    for (const d of dafList(TRACTATE_BY_NAME[tractate])) { delete nl[amudKey(tractate,d,'א')]; delete nl[amudKey(tractate,d,'ב')]; }
    learnedRef.current = nl;
    setLearned(nl); persist('learned');
  }

  function updateRange(name, updates) {
    setRangeState(rs => ({ ...rs, [name]: { ...rs[name], ...updates } }));
  }

  function markRange(tractate, dafim, fromDaf, fromAmud, toDaf, toAmud) {
    const aIdx = a => a === 'א' ? 0 : 1;
    const fromIdx = (fromDaf - 2) * 2 + aIdx(fromAmud);
    const toIdx   = (toDaf  - 2) * 2 + aIdx(toAmud);
    if (fromIdx > toIdx) return;
    const nl = { ...learned };
    for (const d of dafList(TRACTATE_BY_NAME[tractate])) {
      for (const amud of ['א','ב']) {
        const idx = (d - 2) * 2 + aIdx(amud);
        if (idx >= fromIdx && idx <= toIdx) nl[amudKey(tractate, d, amud)] = true;
      }
    }
    learnedRef.current = nl;
    setLearned(nl);
    persist('learned');
  }

  // ספירת עמודים שנלמדו לכל מסכת — מחושב פעם אחת בכל שינוי ב-learned (במקום בכל רינדור)
  const counts = useMemo(() => {
    const m = {};
    for (const sed of SHAS) for (const t of sed.tractates) {
      let c = 0;
      for (const d of dafList(t)) {
        if (learned[amudKey(t.name,d,'א')]) c++;
        if (learned[amudKey(t.name,d,'ב')]) c++;
      }
      m[t.name] = c;
    }
    return m;
  }, [learned]);

  function toggleReview(tractate, daf, amud) {
    const k = amudKey(tractate, daf, amud);
    if (!learnedRef.current[k]) return;
    const nr = { ...reviewsRef.current };
    const next = ((nr[k] || 0) % 9) + 1;
    // 9 → חזרה ל-0 (מחיקה)
    if (next === 1 && (nr[k] || 0) === 9) { delete nr[k]; } else { nr[k] = next; }
    reviewsRef.current = nr;
    setReviews(nr);
    persist('reviews');
  }

  function toggleHard(tractate, daf, amud) {
    const k = amudKey(tractate, daf, amud);
    if (!learnedRef.current[k]) return;
    const nh = { ...hardRef.current };
    if (nh[k]) { delete nh[k]; } else { nh[k] = true; }
    hardRef.current = nh;
    setHard(nh);
    persist('hard');
