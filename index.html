// פרקי המסכת: [{ n, name, start:'21a', seg:5|null }] — seg ממבנה הפרקים של ספריא; null = לפי ״הדרן עלך״. [] = לא ידוע
async function loadChapters(cfg) {
  const local = (cfg.chapters || []).map(([name, start], i) => ({ n: i + 1, name, start, seg: cfg.perek ? 1 : null }));
  if (cfg.perek) return local;
  try {
    const idx = await sefariaJson('v2/raw/index/' + cfg.book);
    const nodes = (idx.alt_structs && idx.alt_structs.Chapters && idx.alt_structs.Chapters.nodes) || [];
    const out = [];
    nodes.forEach((nd, i) => {
      const m = nd.wholeRef && /(\d+[ab])(?::(\d+))?/.exec(nd.wholeRef);
      if (!m) return;
      const he = nd.heTitle || ((nd.titles || []).find(t => t.lang === 'he' && t.primary) || (nd.titles || []).find(t => t.lang === 'he') || {}).text;
      out.push({ n: i + 1, name: local.length === nodes.length ? local[i].name : cleanChapName(he), start: m[1], seg: +(m[2] || 1) });
    });
    if (out.length) return out;
  } catch(e) {}
  return local;
}

// ירושלמי: פרק שלם = [הלכה][קטע]. משטחים לרשימת קטעים, ושומרים איפה מתחילה כל הלכה.
// שטיינזלץ מיושר לקטעים כשהחלוקה זהה; אחרת — כל ביאור ההלכה תחת הקטע הראשון שלה.
async function loadPerek(book, perek) {
  const [g, s] = await Promise.all([
    sefariaJson('v3/texts/' + book + '.' + perek + '?version=hebrew'),
    sefariaJson('v3/texts/Steinsaltz_on_' + book + '.' + perek + '?version=hebrew').catch(() => null),
  ]);
  const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
  const gH = arr(g.versions && g.versions[0] && g.versions[0].text), sH = arr(s && s.versions && s.versions[0] && s.versions[0].text);
  const gem = [], st = [], hal = [];
  gH.forEach((h, hi) => {
    const segs = arr(h), ss = arr(sH[hi]);
    segs.forEach((x, i) => {
      hal.push(i === 0 ? hi + 1 : 0);
      gem.push(cleanSefariaHtml(x));
      st.push(ss.length === segs.length ? cleanSefariaHtml(ss[i]) : i === 0 ? ss.map(cleanSefariaHtml).filter(Boolean).join('<br><br>') : '');
    });
  });
  return { gem, st, hal };
}

async function loadAmud(book, amud) {
  const [g, s] = await Promise.all([
    // עמוד שלא קיים במסכת (4xx) — עמוד ריק, מדולג בתצוגה
    sefariaJson('v3/texts/' + book + '.' + amud + '?version=hebrew').catch(e => { if (e.status >= 400 && e.status < 500) return {}; throw e; }),
    sefariaJson('v3/texts/Steinsaltz_on_' + book + '.' + amud + '?version=hebrew').catch(() => null),
  ]);
  const gem = ((g.versions && g.versions[0] && g.versions[0].text) || []).map(cleanSefariaHtml);
  const st = ((s && s.versions && s.versions[0] && s.versions[0].text) || []).map(cleanSefariaHtml);
  return { gem, st };
}

function Reader({ tractate, bookmark, start, onPos, onStop, learned, onToggleAmud, onClose }) {
  const cfg = READER_TRACTATES[tractate];
  const tInfo = TRACTATE_BY_NAME[tractate];
  const label = u => unitLabel(tractate, u);
  const seq = useMemo(() => cfg.perek ? cfg.chapters.map((_, i) => String(i + 1)) : amudSeq(firstDaf(tInfo) + (READER_STARTS_B.includes(tractate) ? 'b' : 'a'),
    (firstDaf(tInfo) + tInfo.dafim - 1) + (READER_ENDS_A.includes(tractate) ? 'a' : 'b')), [tractate]);
  const [chapters, setChapters] = useState(null);
  const [shown, setShown] = useState([]);         // עמודים שמוצגים, ברצף
  const [texts, setTexts] = useState({});         // amud → { gem, st }
  const textsRef = useRef({});
  const [active, setActive] = useState(null);     // '21b:4'
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [stOpen, setStOpen] = useState(true);
  // חלון פתוח מעל הטקסט: 'nav' (דפים) / 'mishna' (המשנה) / null
  const [overlay, setOverlay] = useState(null);
  const nav = overlay === 'nav';
  // תצוגה: 'both' — גמרא למעלה וביאור למטה; 'st' — ביאור שטיינזלץ בלבד, על כל המסך
  const [view, setView] = useState(() => { try { return localStorage.getItem('reader-view') === 'st' ? 'st' : 'both'; } catch(e) { return 'both'; } });
  const stOnly = view === 'st';
  const [mishna, setMishna] = useState(null); // { status: 'loading'|'ok'|'none'|'error', segs: [{ key, gem, st }] }
  const hasMishnaBtn = MISHNA_PILOT.includes(tractate) && !cfg.perek;
  const [font, setFont] = useState(() => { try { return +localStorage.getItem('reader-font') || 1.3; } catch(e) { return 1.3; } });
  const topRef = useRef(null), botRef = useRef(null), navRef = useRef(null);
  const segEls = useRef({}), stEls = useRef({});
  const prependRef = useRef(null);
  const jumpRef = useRef(null);                    // קטע לגלול אליו אחרי החלפת העמודים המוצגים
  const busyRef = useRef(false);
  const stopKey = bookmark && bookmark.stop;
  const startKey = start || (bookmark && (bookmark.stop || bookmark.last)) || null; // start: פתיחה במקום מסוים (דף יומי)

  // חזרה (כפתור אחורה באנדרואיד / Esc) סוגרת קודם את חלון הניווט ואז את המסך; גלילת הדף שמאחור נעולה
  const overlayRef = useRef(null);
  const closeBtnRef = useRef(null);
  useEffect(() => {
    history.pushState({ reader: 1 }, '');
    const onPop = () => { if (overlayRef.current) { overlayRef.current = null; setOverlay(null); } else onClose(); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); history.back(); } };
    window.addEventListener('popstate', onPop);
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const prevFocus = document.activeElement;
    if (closeBtnRef.current) closeBtnRef.current.focus();
    return () => {
      window.removeEventListener('popstate', onPop); window.removeEventListener('keydown', onKey);
      document.body.style.overflow = prev;
      if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch(e) {}
    };
  }, []);
  // חלון אחד בכל פעם; פתיחה מוסיפה רשומה להיסטוריה כדי ש״אחורה״ יסגור קודם אותו
  function openOverlay(o) { if (!overlayRef.current) history.pushState({ readerOverlay: 1 }, ''); overlayRef.current = o; setOverlay(o); }
  function closeNav() { if (overlayRef.current) history.back(); } // popstate סוגר את החלון
  const toggleNav = () => overlayRef.current === 'nav' ? closeNav() : openOverlay('nav');
  const close = () => { const n = overlayRef.current ? 2 : 1; overlayRef.current = null; history.go(-n); };

  useEffect(() => { try { localStorage.setItem('reader-font', String(font)); } catch(e) {} }, [font]);
  useEffect(() => { try { localStorage.setItem('reader-view', view); } catch(e) {} }, [view]);

  async function fetchAmud(a) {
    if (textsRef.current[a]) return textsRef.current[a];
    const t = await (cfg.perek ? loadPerek : loadAmud)(cfg.book, a);
    textsRef.current = { ...textsRef.current, [a]: t };
    setTexts(textsRef.current);
    return t;
  }

  // תחילת פרק בתוך העמוד (1-based). בלי מבנה מספריא — הסגמנט שאחרי ״הדרן עלך״
  function chapSeg(ch) {
    if (ch.seg) return ch.seg;
    if (ch.n === 1) return 1;
    const t = textsRef.current[ch.start];
    const h = t ? t.gem.findIndex(s => stripNiqqud(s).includes('הדרן עלך')) : -1;
    return h >= 0 ? h + 2 : 1;
  }
  const posOf = key => { const [a, k] = key.split(':'); return seq.indexOf(a) * 10000 + (+k || 1); };
  const curChap = (key) => {
    if (!chapters) return null;
    let cur = chapters[0];
    if (key) for (const ch of chapters) if (posOf(ch.start + ':' + chapSeg(ch)) <= posOf(key)) cur = ch;
    return cur;
  };

  // מציג את amud והעמוד שאחריו, וגולל לקטע seg (ברירת מחדל: ראש העמוד)
  async function jumpTo(a, seg) {
    busyRef.current = true; setBusy(true); setErr(null); closeNav();
    try {
      const i = seq.indexOf(a);
      const pair = seq.slice(i, i + 2);
      await Promise.all(pair.map(fetchAmud));
      jumpRef.current = a + ':' + (seg || 1);
      setShown(pair);
    } catch(e) { setErr('לא הצלחנו לטעון את ' + label(a) + ' מספריא. בדוק חיבור לאינטרנט ונסה שוב.'); }
    busyRef.current = false; setBusy(false);
  }

  // טעינה ראשונה: פרקים, ואז המקום שבו עצרת (או תחילת המסכת)
  async function init() {
    const ch = await loadChapters(cfg);
    setChapters(ch);
    const a = startKey && seq.includes(startKey.split(':')[0]) ? startKey.split(':')[0] : seq[0];
    await jumpTo(a, startKey && a === startKey.split(':')[0] ? +startKey.split(':')[1] : 1);
  }
  useEffect(() => { init(); }, []);

  const segsOf = a => { const t = texts[a]; return t ? t.gem.map((_, i) => i + 1) : []; };

  async function loadNext() {
    if (busyRef.current || !shown.length) return;
    const i = seq.indexOf(shown[shown.length - 1]);
    if (i < 0 || i >= seq.length - 1) return;
    busyRef.current = true; setBusy(true);
    try {
      // עמודים ריקים (לא קיימים בספריא) — ממשיכים לבא אחריהם
      let j = i + 1; const add = [seq[j]];
      while ((await fetchAmud(seq[j])).gem.length === 0 && j < seq.length - 1) add.push(seq[++j]);
      setShown(s => s[s.length - 1] === seq[i] ? [...s, ...add] : s);
    }
    catch(e) { setErr('טעינת העמוד הבא נכשלה — גלול שוב כדי לנסות.'); }
    busyRef.current = false; setBusy(false);
  }
  async function loadPrev() {
    if (busyRef.current || !shown.length) return;
    const i = seq.indexOf(shown[0]);
    if (i <= 0) return;
    busyRef.current = true; setBusy(true);
    try {
      let j = i - 1; const add = [seq[j]];
      while ((await fetchAmud(seq[j])).gem.length === 0 && j > 0) add.unshift(seq[--j]);
      const el = topRef.current;
      prependRef.current = el ? { a: add[0], h: el.scrollHeight - el.scrollTop } : null;
      setShown(s => s[0] === seq[i] ? [...add, ...s] : s);
    } catch(e) { setErr('טעינת העמוד הקודם נכשלה.'); }
    busyRef.current = false; setBusy(false);
  }

  function scrollBotTo(key, smooth) {
    const box = botRef.current, el = stEls.current[key];
    if (!box || !el) return;
    box.scrollTo({ top: el.offsetTop - 8, behavior: smooth ? 'smooth' : 'auto' });
  }
  const quietUntil = useRef(0); // גלילה שאנחנו יזמנו — לא משנה את הקטע הפעיל
  function scrollTopTo(key) {
    const box = topRef.current, el = segEls.current[key];
    if (!box || !el) return;
    quietUntil.current = Date.now() + 500;
    const r = el.getBoundingClientRect(), br = box.getBoundingClientRect();
    box.scrollTop += r.top - br.top - box.clientHeight * 0.25;
  }
  function activate(key, fromBottom) {
    setActive(key);
    onPos(key);
    if (fromBottom) scrollTopTo(key); else scrollBotTo(key, true);
  }

  React.useLayoutEffect(() => {
    const el = topRef.current; if (!el) return;
    // אחרי הוספת עמוד למעלה — שומרים על מקום הקריאה
    const pre = prependRef.current; prependRef.current = null;
    if (pre && shown[0] === pre.a) { el.scrollTop = el.scrollHeight - pre.h; if (active) scrollBotTo(active, false); }
    // אחרי קפיצה (פתיחה, ניווט) — אל הקטע המבוקש
    const key = jumpRef.current;
    if (key) {
      jumpRef.current = null;
      const k = segEls.current[key] ? key : shown[0] + ':1';
      quietUntil.current = Date.now() + 500;
      el.scrollTop = 0;
      if (k.split(':')[1] !== '1') scrollTopTo(k);
      setActive(k); onPos(k);
      requestAnimationFrame(() => scrollBotTo(k, false));
    }
  }, [shown]);

  // החלפת תצוגה — נשארים באותו קטע
  const firstView = useRef(true);
  useEffect(() => {
    if (firstView.current) { firstView.current = false; return; }
    if (active) requestAnimationFrame(() => { scrollTopTo(active); if (!stOnly) scrollBotTo(active, false); });
  }, [view]);

  // המשנה שעליה עומדת הגמרא במקום הנוכחי: הולכים אחורה עד הקטע שמתחיל ב״מתני׳״ (עד תחילת המסכת),
  // ואוספים את קטעי המשנה עד ״גמ׳״. העמודים נטענים בקבוצות של 4 (ונשמרים במטמון)
  async function findMishna(key) {
    const [a0, k0] = key.split(':');
    let i = seq.indexOf(a0);
    while (i >= 0) {
      const batch = seq.slice(Math.max(0, i - 3), i + 1);
      const ts = await Promise.all(batch.map(fetchAmud));
      for (let b = batch.length - 1; b >= 0; b--) {
        const t = ts[b], first = batch[b] === a0;
        for (let k = first ? Math.min(+k0 || 1, t.gem.length) : t.gem.length; k >= 1; k--) {
          if (isMishnaStart(t.gem[k - 1])) return collectMishna(seq.indexOf(batch[b]), k);
        }
      }
      i -= batch.length;
    }
    return null;
  }
  async function collectMishna(i, k) {
    const out = [];
    while (i < seq.length && out.length < 12) {
      const t = await fetchAmud(seq[i]);
      if (k > t.gem.length) { i++; k = 1; if (out.length && i - seq.indexOf(out[0].key.split(':')[0]) > 2) break; continue; }
      const g = t.gem[k - 1];
      if (out.length && (isGemaraStart(g) || isMishnaStart(g))) break;
      out.push({ key: seq[i] + ':' + k, gem: g, st: t.st[k - 1] || '' });
      k++;
    }
    return out;
  }
  function openMishna() {
    if (overlayRef.current === 'mishna') { closeNav(); return; }
    if (!active && !shown.length) return;
    openOverlay('mishna');
    loadMishna();
  }
  async function loadMishna() {
    const key = active || shown[0] + ':1';
    setMishna({ status: 'loading' });
    try {
      const segs = await findMishna(key);
      setMishna(segs && segs.length ? { status: 'ok', segs } : { status: 'none' });
    } catch(e) { setMishna({ status: 'error' }); }
  }

  // פתיחה מחדש של חלון הביאור — מיד אל הקטע הפעיל
  useEffect(() => { if (stOpen && active) requestAnimationFrame(() => scrollBotTo(active, false)); }, [stOpen]);
  // חלון הניווט נפתח על הפרק הנוכחי
  useEffect(() => {
    if (!nav || !navRef.current) return;
    const el = navRef.current.querySelector('[data-cur="1"]');
    if (el) el.scrollIntoView({ block: 'center' });
  }, [nav]);

  // גלילת הגמרא: הסגמנט שעל ״קו הקריאה״ (רבע מגובה החלון) הוא הפעיל, והביאור עוקב אחריו
  const rafRef = useRef(0);
  function onTopScroll() {
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => {
      rafRef.current = 0;
      const box = topRef.current; if (!box || jumpRef.current) return;
      if (box.scrollTop + box.clientHeight > box.scrollHeight - 500) loadNext();
      if (Date.now() < quietUntil.current) return;
      const line = box.getBoundingClientRect().top + box.clientHeight * 0.25;
      let cur = null;
      for (const a of shown) for (const k of segsOf(a)) {
        const el = segEls.current[a + ':' + k];
        if (el && el.getBoundingClientRect().top <= line) cur = a + ':' + k;
      }
      if (cur && cur !== active) { setActive(cur); onPos(cur); scrollBotTo(cur, true); }
    });
  }

  const activeAmud = active ? active.split(':')[0] : shown[0];
  const chap = curChap(active);
  const atStart = !shown.length || seq.indexOf(shown[0]) <= 0;
  const atEnd = !shown.length || seq.indexOf(shown[shown.length - 1]) >= seq.length - 1;
  const isStop = active && active === stopKey;
  const amudDone = a => learned[amudKey(tractate, parseInt(a, 10), a.endsWith('b') ? 'ב' : 'א')];
  const toggleDone = a => onToggleAmud(tractate, parseInt(a, 10), a.endsWith('b') ? 'ב' : 'א');
  const chapStartsAt = (a, k) => chapters && chapters.find(c => c.start === a && chapSeg(c) === k);
  const btn = { background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.22)', borderRadius:8, color:'#e8f0ff', fontFamily:"'Heebo',sans-serif", fontSize:'0.8rem', padding:'0.3rem 0.6rem', cursor:'pointer', whiteSpace:'nowrap' };
  const chapHeading = c => (
    <div style={{ textAlign:'center', margin:'0.8rem 0 0.6rem', fontFamily:"'Frank Ruhl Libre',serif" }}>
      <div style={{ fontSize:'0.8rem', color:'#8a6000', fontWeight:600, fontFamily:"'Heebo',sans-serif" }}>פרק {hebNum(c.n)}</div>
      <div style={{ fontSize:'1.35rem', fontWeight:900, color:'#1a2d6e' }}>{c.name}</div>
    </div>
  );

  // חלון ניווט: פרקים, ובכל פרק — הדפים שלו
  const lastDaf = firstDaf(tInfo) + tInfo.dafim - 1;
  const navGroups = !chapters ? [] : !chapters.length ? [{ c: null, dafim: Array.from({ length: tInfo.dafim }, (_, i) => i + firstDaf(tInfo)) }] : chapters.map((c, i) => {
    const from = parseInt(c.start, 10), next = chapters[i + 1];
    const to = next ? parseInt(next.start, 10) - (next.start.endsWith('a') && chapSeg(next) === 1 ? 1 : 0) : lastDaf;
    const dafim = []; for (let d = from; d <= to; d++) dafim.push(d);
    return { c, dafim: cfg.perek ? [] : dafim };
  });
  const amudBtn = (d, side) => {
    const a = d + side, cur = a === activeAmud, done = amudDone(a);
    if (!seq.includes(a)) return <span key={side} style={{ flex:1 }} />;
    return (
      <button key={side} onClick={() => jumpTo(a, 1)} aria-label={amudLabel(a) + (done ? ' (נלמד)' : '')}
        style={{ flex:1, border: cur ? '2px solid #2a40a0' : '1px solid #d8e0f0', background: done ? '#e3f4ec' : '#fff', color: done ? '#1a7a50' : '#3a4f7a', borderRadius:6, fontSize:'0.72rem', fontWeight: cur ? 800 : 600, padding:'0.22rem 0', cursor:'pointer', fontFamily:"'Heebo',sans-serif" }}>
        {side === 'a' ? 'ע״א' : 'ע״ב'}
      </button>
    );
  };

  return (
    <div dir="rtl" role="dialog" aria-modal="true" aria-label={'עיון — ' + tractate} className="safe-top" style={{ position:'fixed', inset:0, zIndex:500, background:'#fff', display:'flex', flexDirection:'column', fontFamily:"'Heebo',sans-serif" }}>
      {/* כותרת */}
      <div className="on-dark" style={{ background:'linear-gradient(135deg,#1a2d6e 0%,#2a40a0 100%)', color:'#e8f0ff', padding:'0.55rem 0.8rem', display:'flex', alignItems:'center', gap:'0.5rem', boxShadow:'0 2px 12px rgba(20,40,100,0.3)', position:'relative', zIndex:2 }}>
        <button ref={closeBtnRef} onClick={close} aria-label="סגור את מסך העיון" style={{ ...btn, fontSize:'1.05rem', padding:'0.15rem 0.55rem' }}>→</button>
        <button onClick={toggleNav} aria-expanded={nav} aria-label={'ניווט — ' + tractate + (activeAmud ? ', ' + label(activeAmud) : '')} style={{ flex:1, minWidth:0, background:'none', border:'none', color:'inherit', textAlign:'right', cursor:'pointer', padding:0, fontFamily:'inherit' }}>
          <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontWeight:700, fontSize:'1.05rem', lineHeight:1.2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{tractate}{chap ? ' · ' + (chap.name || 'פרק ' + hebNum(chap.n)) : ''}</div>
          <div style={{ fontSize:'0.74rem', color:'#e8c040', fontWeight:600 }}>{activeAmud ? label(activeAmud) : ''} <span style={{ color:'#b8ceff' }}>{nav ? '▲' : '▼'}</span></div>
        </button>
        <button onClick={toggleNav} aria-expanded={nav} aria-label="ניווט לפרק או דף" style={{ ...btn, background: nav ? '#e8f0ff' : btn.background, color: nav ? '#1a2d6e' : btn.color, fontWeight:700, fontSize:'1rem', padding:'0.2rem 0.6rem' }} title="דפים ופרקים">☰</button>
        {hasMishnaBtn && <button onClick={openMishna} aria-expanded={overlay === 'mishna'} aria-label="הצג את המשנה שעליה עומדת הגמרא כאן" title="המשנה"
          style={{ ...btn, background: overlay === 'mishna' ? '#e8f0ff' : btn.background, color: overlay === 'mishna' ? '#1a2d6e' : btn.color, fontWeight:700 }}>📜 משנה</button>}
        <button onClick={() => active && onStop(isStop ? null : active)} disabled={!active}

                      style={{ background: on ? '#e3edfc' : stop ? '#fff4d6' : 'transparent', borderRadius:4, cursor:'pointer', transition:'background 0.2s', boxDecorationBreak:'clone', WebkitBoxDecorationBreak:'clone' }}>

        </div>}

      {/* ביאור שטיינזלץ */}

          : <button onClick={() => setStOpen(o => !o)} aria-expanded={stOpen}
              style={{ flex:1, background:'none', border:'none', padding:'0.55rem 1rem', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.02rem', fontWeight:700, color:'#3a3a3a' }}>
              <span>ביאור שטיינזלץ</span><span style={{ fontSize:'0.8rem', color:'#6b6b6b' }}>{stOpen ? '▼' : '▲'}</span>

        <button onClick={() => setView(stOnly ? 'both' : 'st')} aria-pressed={stOnly}
          style={{ background: stOnly ? '#2a40a0' : '#fff', color: stOnly ? '#fff' : '#2a40a0', border:'1px solid #c0ccf0', borderRadius:99, margin:'0.35rem 0.6rem', padding:'0.2rem 0.75rem', fontSize:'0.76rem', fontWeight:700, cursor:'pointer', fontFamily:"'Heebo',sans-serif", whiteSpace:'nowrap' }}>
          {stOnly ? 'גמרא + ביאור' : 'ביאור בלבד'}

      {stOpen && !stOnly && <div ref={botRef} tabIndex={0} aria-label="ביאור שטיינזלץ" style={{ flex:'1 1 48%', overflowY:'auto', background:'#fafaf8', padding:'0.6rem 1rem 3rem', position:'relative', WebkitOverflowScrolling:'touch' }}>
        {shown.map(a => segsOf(a).map(k => {
          const key = a + ':' + k, html = texts[a].st[k - 1], on = key === active;
          if (!html) return null;
          return (
            <div key={key} ref={el => { stEls.current[key] = el; }} onClick={() => activate(key, true)}
              style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize: (font * 0.88) + 'rem', lineHeight:1.85, color: on ? '#1a2340' : '#5a6070', padding:'0.45rem 0.6rem', margin:'0 -0.6rem 0.2rem', borderRadius:8, borderRight: on ? '3px solid #4a67c8' : '3px solid transparent', background: on ? '#fff' : 'transparent', cursor:'pointer', textAlign:'justify' }}
              dangerouslySetInnerHTML={{ __html: html }} />
          );
        }))}
        <div style={{ fontSize:'0.68rem', color:'#9a9a9a', textAlign:'center', marginTop:'1.5rem', lineHeight:1.6, fontFamily:"'Heebo',sans-serif" }}>
          הטקסט מספריא (Sefaria) · תלמוד מהדורת William Davidson · ביאור הרב עדין שטיינזלץ · CC BY-NC
        </div>
      </div>}
      </div>
    </div>
  );
}

// שדות שמסונכרנים מול הענן, ואיך ממזגים כל אחד כשיש שינוי מקומי שטרם נשמר
const FIELDS = ['learned', 'reviews', 'hard', 'journal', 'streak', 'target'];

function App() {
  const [user, setUser] = useState(null);
  const userRef = useRef(null); // למטפלים שנרשמים פעם אחת (onAuthStateChanged) — תמיד המשתמש הנוכחי
  const [loading, setLoading] = useState(true);
  const [learned, setLearned] = useState({});
  const [journal, setJournal] = useState([]);
  const [openCards, setOpenCards] = useState({});
  const [search, setSearch] = useState('');
  const [flash, setFlash] = useState(null);
  const [tab, setTab] = useState('shas');
  const [newEntry, setNewEntry] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  const [quoteOpen, setQuoteOpen] = useState(false);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  // מצב צפייה-בלבד: 'cached' (עותק מקומי), 'nocache' (אין נתונים), 'denied' (אין הרשאה) — אסור לשנות ולכתוב לענן
  const [offlineView, setOfflineView] = useState(null);
  const offlineRef = useRef(null);
  useEffect(() => { offlineRef.current = offlineView; }, [offlineView]);
  const [rangeState, setRangeState] = useState({});
  const [sinaiOpen, setSinaiOpen] = useState({});
  const [sinaiOpenedCard, setSinaiOpenedCard] = useState({});
  const [reviews, setReviews] = useState({});
  const [reviewsMode, setReviewsMode] = useState({});
  const [backupMsg, setBackupMsg] = useState(null);
  const [streakData, setStreakData] = useState(null);
  const [hard, setHard] = useState({});
  const [hardMode, setHardMode] = useState({});
  // מסך עיון: סימניות לכל מסכת — { last: '21b:4' (אוטומטי), stop: '23a:2' (📍 ידני), updated }
  const [readerMarks, setReaderMarks] = useState({});
  const readerMarksRef = useRef({});
  const readerSaveT = useRef(null);
  const [readerOpen, setReaderOpen] = useState(null);
  const [readerStart, setReaderStart] = useState(null);
  const [targetDate, setTargetDate] = useState(null);
  const [ageInput, setAgeInput] = useState('');
  const [birthInput, setBirthInput] = useState('');
  const [toastMsg, setToastMsg] = useState(null);
  const [updateReady, setUpdateReady] = useState(!!window._swUpdated);

  const learnedRef = useRef({}), reviewsRef = useRef({}), hardRef = useRef({}), journalRef = useRef([]), streakRef = useRef(null), targetRef = useRef('');
  const refs = { learned: learnedRef, reviews: reviewsRef, hard: hardRef, journal: journalRef, streak: streakRef, target: targetRef };
  const setters = { learned: setLearned, reviews: setReviews, hard: setHard, journal: setJournal, streak: setStreakData, target: applyTarget };
  function setField(f, v) { refs[f].current = v; setters[f](v); }

  // מגן מפני דריסת נתוני ענן בנתונים ריקים — שמירה רק אחרי שהטעינה הצליחה
  const dataLoadedRef = useRef(false);
  // שינויים מקומיים שעוד לא אושרו בשרת, לכל שדה. 0 = מסונכרן.
  // כשאין שינוי ממתין — השרת קובע (כך ביטול סימון במכשיר אחד עובר לשני ולא "חוזר").
  // כשיש שינוי ממתין — מיזוג, כדי לא לאבד אף סימון; מה שהמשתמש מחק כאן (removedRef) לא חוזר מהשרת.
  const pendingRef = useRef(Object.fromEntries(FIELDS.map(f => [f, 0])));
  const wipeRef = useRef({});   // השינוי האחרון בשדה היה מחיקה מכוונת
  const removedRef = useRef(Object.fromEntries(FIELDS.map(f => [f, new Set()])));
  const seqRef = useRef(0);
  const MERGE = {
    learned: (l, s) => mergeInto(l, s, removedRef.current.learned),
    reviews: (l, s) => mergeInto(l, s, removedRef.current.reviews),
    hard:    (l, s) => mergeInto(l, s, removedRef.current.hard),
    journal: (l, s) => mergeJournal(l, s, removedRef.current.journal),
    streak:  mergeStreak,
    target:  () => null,
  };

  function save(uid, f) {
    const seq = pendingRef.current[f];
    return fbSave(uid, 'shas-' + f, refs[f].current, wipeRef.current[f]).then(ok => {
      if (ok && pendingRef.current[f] === seq) { pendingRef.current[f] = 0; wipeRef.current[f] = false; removedRef.current[f].clear(); }
      return ok;
    });
  }
  // שמירה לענן — גם בלי רשת: Firestore שומר את הכתיבה בתור מקומי ושולח כשהרשת חוזרת
  function persist(field, removal) {
    pendingRef.current[field] = ++seqRef.current;
    wipeRef.current[field] = !!removal;
    saveLocalSoon();
    if (!user || !dataLoadedRef.current) return;
    save(user.uid, field);
  }
  function flushPending(uid) {
    for (const f in pendingRef.current) if (pendingRef.current[f]) save(uid, f);
  }

  // עותק מקומי מלא (לצפייה כשאין רשת) — מתעדכן אחרי כל שינוי
  const localT = useRef(null);
  function saveLocalNow() {
    clearTimeout(localT.current); localT.current = null;
    const u = userRef.current;
    if (!dataLoadedRef.current || !u) return;
    const d = { _uid: u.uid };
    for (const f of FIELDS) {
      const v = refs[f].current;
      if (f === 'target') { if (v) d['shas-target'] = v; }
      else if (v != null) d['shas-' + f] = JSON.stringify(v);
    }
    d['shas-reader'] = JSON.stringify(readerMarksRef.current);
    try { localStorage.setItem('shas-fulldata', JSON.stringify(d)); } catch(e) {}
  }
  function saveLocalSoon() { if (!localT.current) localT.current = setTimeout(saveLocalNow, 800); }
  function clearLocal() { try { ['shas-fulldata', 'shas-learned', 'shas-reader'].forEach(k => localStorage.removeItem(k)); } catch(e) {} }

  // במצב צפייה-בלבד — לא משנים כלום (אחרת השינוי נראה שמור אבל הולך לאיבוד)
  function readOnly() {
    if (!offlineRef.current) return false;
    toast('מצב צפייה בלבד — אין חיבור לשרת, ולכן אי אפשר לשנות כרגע.', 'info');
    return true;
  }

  // יעד: יעדים ישנים חושבו בשנה העברית הלא נכונה — מחשבים מחדש מתאריך הלידה והגיל
  function normalizeTarget(raw) {
    if (!raw) return '';
    try {
      const o = JSON.parse(raw);
      if (o && o.birth && o.birth.length === 10 && o.age) {

  useEffect(() => {

        try {
          const raw = d['shas-' + f];

          if (server === null || typeof server !== (f === 'target' ? 'string' : 'object')) continue;
          const local = refs[f].current;
          let next = null;
          if (pendingRef.current[f]) next = MERGE[f](local, server); // יש שינוי מקומי שטרם נשמר — לא מאבדים כלום
          else if (JSON.stringify(server) !== JSON.stringify(local)) next = server; // מסונכרן — מאמצים את מצב השרת (כולל מחיקות)

                                      target="_blank" rel="noopener noreferrer"
                                      style={{ fontSize:'0.8rem', fontFamily:"'Frank Ruhl Libre',serif", color:'#92400e', background:'#fef3c7', border:'1px solid #fbbf24', borderRadius:5, padding:'0.12rem 0.38rem', textDecoration:'none', fontWeight:600, lineHeight:1.6 }}>
                                      {HEB[daf]}
                                    </a>
                                  ))}
                                </div>
                              </div>
                            )}
                            <div style={{ display:'flex', gap:'0.5rem', marginBottom:'0.7rem', alignItems:'center', flexWrap:'wrap' }}>
                              <button className="mbtn" style={{ background:'#e7edfb', color:'#2e4080' }} onClick={e => { e.stopPropagation(); markAll(t.name); }}>✓ סמן הכל</button>
                              {cnt > 0 && <button className="mbtn" style={{ background:'#fdecec', color:'#8b2020' }} onClick={e => { e.stopPropagation(); unmarkAll(t.name); }}>✕ נקה הכל</button>}
                              <button className="mbtn" style={{ background: showRange ? '#2e4080' : '#e7edfb', color: showRange ? '#fff' : '#2e4080' }}
                                aria-expanded={showRange} onClick={e => { e.stopPropagation(); updateRange(t.name, { showRange: !showRange }); }}>
                                <Ic d={ICONS.range} size={12} /> סמן טווח {showRange ? '▲' : '▼'}
                              </button>
                              {cnt > 0 && <button className="mbtn" style={{ background: reviewsMode[t.name] ? '#7c3aed' : '#f1edfd', color: reviewsMode[t.name] ? '#fff' : '#5b21b6' }}
                                onClick={e => { e.stopPropagation(); setReviewsMode(m => ({...m, [t.name]: !m[t.name]})); if (!reviewsMode[t.name]) setHardMode(m => ({...m, [t.name]: false})); }}>
                                <Ic d={ICONS.refresh} size={12} /> חזרות {reviewsMode[t.name] ? '▲' : '▼'}
                              </button>}
                              {cnt > 0 && <button className="mbtn" style={{ background: hardMode[t.name] ? '#dc2626' : '#fdeaea', color: hardMode[t.name] ? '#fff' : '#b91c1c' }}
                                onClick={e => { e.stopPropagation(); setHardMode(m => ({...m, [t.name]: !m[t.name]})); if (!hardMode[t.name]) setReviewsMode(m => ({...m, [t.name]: false})); }}>
                                <Ic d={ICONS.star} size={12} /> קשה {hardMode[t.name] ? '▲' : '▼'}
                              </button>}
                              <span style={{ fontSize:'0.68rem', color:'#5f6e8e', marginRight:'auto' }}>{tPct}%  ·  {t.dafim} דפים</span>
                            </div>
                            {showRange && (
                              <div style={{ background:'#fff', border:'1.5px solid #c0ccf0', borderRadius:9, padding:'0.65rem 0.9rem', marginBottom:'0.7rem', display:'flex', flexWrap:'wrap', gap:'0.5rem', alignItems:'center' }}>
                                <span style={{ fontSize:'0.75rem', color:'#3a4f7a', fontWeight:600 }}>מדף</span>
                                <select aria-label="מדף" value={rFromDaf} onClick={e => e.stopPropagation()} onChange={e => { e.stopPropagation(); updateRange(t.name, { fromDaf: Number(e.target.value) }); }}
                                  style={{ border:'1px solid #c0ccf0', borderRadius:5, padding:'0.2rem 0.3rem', fontFamily:"'Frank Ruhl Libre',serif", fontSize:'0.82rem', color:'#1a2340', background:'#f7f9ff' }}>
                                  {dafOptions.map(d => <option key={d} value={d}>{HEB[d]}</option>)}
                                </select>
                                {amudToggle('fromAmud', rFromAmud, 'עמוד התחלה')}
                                <span style={{ fontSize:'0.75rem', color:'#3a4f7a', fontWeight:600 }}>עד דף</span>
                                <select aria-label="עד דף" value={rToDaf} onClick={e => e.stopPropagation()} onChange={e => { e.stopPropagation(); updateRange(t.name, { toDaf: Number(e.target.value) }); }}
                                  style={{ border:'1px solid #c0ccf0', borderRadius:5, padding:'0.2rem 0.3rem', fontFamily:"'Frank Ruhl Libre',serif", fontSize:'0.82rem', color:'#1a2340', background:'#f7f9ff' }}>
                                  {dafOptions.map(d => <option key={d} value={d}>{HEB[d]}</option>)}
                                </select>
                                {amudToggle('toAmud', rToAmud, 'עמוד סיום')}
                                <button onClick={e => { e.stopPropagation(); if (markRange(t.name, rFromDaf, rFromAmud, rToDaf, rToAmud)) updateRange(t.name, { showRange: false }); }}
                                  style={{ background:'#2a40a0', color:'#fff', border:'none', borderRadius:6, padding:'0.28rem 0.85rem', fontFamily:"'Heebo',sans-serif", fontWeight:700, fontSize:'0.75rem', cursor:'pointer' }}>
                                  ✓ סמן
                                </button>
                              </div>
                            )}
                            {isDY_tractate && <div style={{ fontSize:'0.7rem', color:'#9a4a08', fontWeight:600, marginBottom:'0.4rem', display:'flex', alignItems:'center', gap:'0.3rem' }}><Ic d={ICONS.cal} size={12} /> הדף היומי: {HEB[getTodayDafYomi().daf]} — מסומן בצהוב</div>}
                            <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                              {dafList(t).map(daf =>
                                ['א','ב'].filter(amud => hasAmud(t, daf, amud)).map(amud => {
                                  const k = amudKey(t.name, daf, amud);
                                  const isL = !!learned[k];
                                  const dy = getTodayDafYomi();
                                  const isDY = dy && dy.tractate === t.name && dy.daf === daf;
                                  const act = () => hardMode[t.name] ? toggleHard(t.name, daf, amud) : reviewsMode[t.name] ? toggleReview(t.name, daf, amud) : toggleAmud(t.name, daf, amud);
                                  const mode = hardMode[t.name] ? 'סימון קושי' : reviewsMode[t.name] ? 'סימון חזרה' : (isL ? 'בטל סימון' : 'סמן כנלמד');
                                  const label = t.name + ' דף ' + HEB[daf] + ' עמוד ' + amud + ' — ' + (isL ? 'נלמד' : 'לא נלמד') + (isL && reviews[k] ? ', ' + reviews[k] + ' חזרות' : '') + (isL && hard[k] ? ', קשה' : '') + (isDY ? ', הדף היומי' : '') + '. ' + mode;
                                  return (
                                    <div key={k} role="button" tabIndex={0} aria-label={label} aria-pressed={isL}
                                      className={'amud-cell' + (isL ? ' learned' : '') + (flash === k ? ' flash' : '') + (reviewsMode[t.name] && isL && !hardMode[t.name] ? ' review-mode' : '') + (hardMode[t.name] && isL ? ' hard-mode' : '') + (isDY ? ' daf-yomi' : '')}
                                      onClick={act}
                                      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } }}>
                                      {isL && reviews[k] > 0 && <span aria-hidden="true" style={{ position:'absolute', top:2, left:2, background:'#e8c040', color:'#1a2340', fontSize:'0.48rem', fontWeight:900, width:13, height:13, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', lineHeight:1, fontFamily:'sans-serif' }}>{reviews[k]}</span>}
                                      {isL && hard[k] && <div style={{ position:'absolute', bottom:0, left:0, right:0, height:3, background:'#ef4444', borderRadius:'0 0 5px 5px', pointerEvents:'none' }} />}
                                      <span className="daf-num">{HEB[daf]}</span>
                                      <span className="amud-letter">{amud}</span>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          </div>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>}

        {tab === 'target' && (() => {
          const targetObj = targetDate ? (() => { try { return JSON.parse(targetDate); } catch(e) { return null; } })() : null;
          const [bY, bM, bD] = birthInput.split('-');
          const daysInMonth = new Date(+bY || 2000, +bM || 1, 0).getDate();
          // מעדכן חלק אחד בתאריך הלידה; יום שלא קיים בחודש (31 בפברואר) מתקצר לסוף החודש
          const setBirthPart = (i, v) => {
            const parts = [bY || '', bM || '', bD || ''];
            parts[i] = v;
            if (parts[0] && parts[1] && parts[2]) parts[2] = String(Math.min(+parts[2], new Date(+parts[0], +parts[1], 0).getDate())).padStart(2, '0');
            setBirthInput(parts.join('-'));
          };
          const birthOk = !!(bY && bM && bD);
          const birthDateObj = birthOk ? parseLocalDate(birthInput) : null;
          const ageNum = Number(ageInput);
          const nowAge = birthDateObj ? (Date.now() - birthDateObj) / (365.2425 * 864e5) : null;
          const bdayResult = (birthDateObj && ageInput && Number.isInteger(ageNum)) ? hebrewBirthdayAtAge(birthDateObj, ageNum) : null;
          const ageError = !ageInput ? null
            : !Number.isInteger(ageNum) || ageNum < 1 ? 'יש להזין גיל במספר שלם'
            : ageNum > 120 ? 'גיל היעד צריך להיות עד 120'
            : nowAge != null && ageNum <= nowAge ? 'הגיל הזה כבר עבר — בחר גיל גדול יותר'
            : null;
          const canSave = birthOk && ageInput && !ageError;
          const sel = { border:'1.5px solid #d8e0f0', borderRadius:8, padding:'0.6rem 0.4rem', fontFamily:"'Heebo',sans-serif", fontSize:'0.95rem', color:'#1a2340', background:'#fff' };
          return (
          <div style={{ maxWidth:500, margin:'0 auto' }}>
            <div style={{ background:'#fff', border:'1.5px solid #d8e0f0', borderRadius:16, padding:'2rem', boxShadow:'0 2px 12px rgba(30,45,90,0.08)', textAlign:'center' }}>
              <div style={{ marginBottom:'0.8rem', color:'#2a40a0', display:'flex', justifyContent:'center' }}><Ic d={ICONS.target} size={42} /></div>
              <h2 style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.3rem', fontWeight:700, color:'#2e4080', marginBottom:'0.3rem' }}>
                באיזה גיל היית רוצה לסיים את הש״ס?
              </h2>
              <div style={{ fontSize:'0.82rem', color:'#5f6e8e', marginBottom:'1.8rem' }}>
                {targetObj ? 'תמיד אפשר לעדכן' : 'נחשב יחד את הקצב הנדרש'}
              </div>
              {targetObj && (
                <div style={{ background:'#eef1ff', border:'1.5px solid #c0ccf0', borderRadius:12, padding:'1rem', marginBottom:'1.5rem' }}>
                  <div style={{ fontSize:'0.75rem', color:'#4a5f98', marginBottom:'0.3rem' }}>היעד שלך</div>
                  <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.3rem', fontWeight:700, color:'#2a40a0' }}>
                    סיום עד גיל {targetObj.age}
                  </div>
                  <div style={{ fontSize:'0.82rem', color:'#4a5f98', marginTop:'0.2rem' }}>
                    {fmtHebDate(targetObj)}
                  </div>
                </div>
              )}
              <div style={{ display:'flex', flexDirection:'column', gap:'1rem', marginBottom:'1.2rem', textAlign:'right' }}>
                <div>
                  <label htmlFor="target-age" style={{ display:'block', fontSize:'0.8rem', color:'#4a5f98', marginBottom:'0.3rem', fontWeight:600 }}>גיל יעד לסיום</label>
                  <input id="target-age" type="number" inputMode="numeric" min="1" max="120" step="1" value={ageInput} onChange={e => setAgeInput(e.target.value)}
                    placeholder="למשל: 50" aria-invalid={!!ageError} aria-describedby={ageError ? 'target-age-err' : undefined}
                    style={{ width:'100%', border:'1.5px solid ' + (ageError ? '#dc2626' : '#d8e0f0'), borderRadius:8, padding:'0.65rem 0.9rem', fontFamily:"'Heebo',sans-serif", fontSize:'1rem', color:'#1a2340', textAlign:'center', boxSizing:'border-box' }}
                  />
                  {ageError && <div id="target-age-err" style={{ fontSize:'0.78rem', color:'#b91c1c', marginTop:'0.3rem', fontWeight:600 }}>{ageError}</div>}
                </div>
                <fieldset style={{ border:'none', padding:0, margin:0 }}>
                  <legend style={{ fontSize:'0.8rem', color:'#4a5f98', marginBottom:'0.3rem', fontWeight:600 }}>תאריך לידה (לועזי)</legend>
                  <div style={{ display:'flex', gap:'0.5rem', direction:'rtl' }}>
                    <select aria-label="יום לידה" value={bD || ''} onChange={e => setBirthPart(2, e.target.value)} style={{ ...sel, flex:1 }}>
                      <option value="">יום</option>
                      {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => <option key={d} value={String(d).padStart(2,'0')}>{d}</option>)}
                    </select>
                    <select aria-label="חודש לידה" value={bM || ''} onChange={e => setBirthPart(1, e.target.value)} style={{ ...sel, flex:2 }}>
                      <option value="">חודש</option>
                      {['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'].map((mn,i) => <option key={i+1} value={String(i+1).padStart(2,'0')}>{mn}</option>)}
                    </select>
                    <select aria-label="שנת לידה" value={bY || ''} onChange={e => setBirthPart(0, e.target.value)} style={{ ...sel, flex:2 }}>
                      <option value="">שנה</option>
                      {Array.from({length:90},(_,i)=>new Date().getFullYear()-10-i).map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                  </div>
                </fieldset>
              </div>
              {bdayResult && !ageError && (
                <div aria-live="polite" style={{ fontSize:'0.85rem', color:'#3a4f7a', marginBottom:'1.2rem', background:'#f7f9ff', borderRadius:8, padding:'0.6rem' }}>
                  תאריך יעד מחושב: <strong>{bdayResult.hebrew}</strong>
                </div>
              )}
              <button disabled={!canSave} onClick={() => {
                const b = parseLocalDate(birthInput);
                const r = hebrewBirthdayAtAge(b, ageNum);
                const d = r ? r.gregorian : new Date(b.getFullYear() + ageNum, b.getMonth(), b.getDate());
                saveTarget({ age: ageNum, birth: birthInput, date: d.toISOString(), hebrewLabel: r ? r.hebrew : null });
                setTab('shas');
              }} style={{ background: canSave ? '#2a40a0' : '#9aa6c4', color:'#fff', border:'none', borderRadius:8, padding:'0.7rem 2rem', fontFamily:"'Heebo',sans-serif", fontWeight:700, fontSize:'0.95rem', cursor: canSave ? 'pointer' : 'not-allowed', width:'100%', marginBottom:'0.8rem' }}>
                {targetObj ? 'עדכן יעד' : 'הגדר יעד'}
              </button>
              {targetObj && (
                <button onClick={() => { if (confirm('להסיר את היעד?')) saveTarget(null); }} style={{ background:'none', border:'none', color:'#5f6e8e', fontSize:'0.78rem', cursor:'pointer', fontFamily:"'Heebo',sans-serif", textDecoration:'underline', padding:'0.3rem' }}>
                  הסר יעד
                </button>
              )}
            </div>
          </div>
          );
        })()}

        {tab === 'journal' && (
          <div style={{ maxWidth:660, margin:'0 auto' }}>
            <div style={{ marginBottom:'1.2rem' }}>
              <h2 style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.15rem', fontWeight:700, color:'#2e4080', marginBottom:'0.2rem' }}>יומן למידה</h2>
              <div style={{ fontSize:'0.8rem', color:'#5f6e8e' }}>רשום היכן הגעת, מה חידשת, מה רצית לזכור</div>
            </div>
            <div style={{ background:'#fff', border:'1.5px solid #d8e0f0', borderRadius:12, padding:'1rem', marginBottom:'1.2rem', boxShadow:'0 2px 8px rgba(30,45,90,0.06)' }}>
              <textarea value={newEntry} onChange={e => setNewEntry(e.target.value)} aria-label="רשומה חדשה ביומן"
                placeholder={"הגעתי עד...\nחידוש שראיתי...\nרעיון שרציתי לזכור..."}
                style={{ width:'100%', minHeight:85, background:'#f2f5fc', border:'1.5px solid #d8e0f0', borderRadius:8, color:'#1a2340', fontFamily:"'Heebo',sans-serif", fontSize:'0.9rem', padding:'0.75rem', resize:'vertical', direction:'rtl', lineHeight:1.65 }}
              />
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'0.6rem' }}>
                <span style={{ fontSize:'0.7rem', color:'#5f6e8e' }}>היום: {today()}</span>
                <button onClick={addEntry} style={{ background:'#2a40a0', color:'#fff', border:'none', borderRadius:8, padding:'0.48rem 1.1rem', fontFamily:"'Heebo',sans-serif", fontWeight:700, fontSize:'0.85rem', cursor:'pointer' }}>+ הוסף</button>
              </div>
            </div>
            {journal.length === 0 && (
              <div style={{ textAlign:'center', color:'#5f6e8e', padding:'2.5rem', fontSize:'0.88rem' }}>
                <div style={{ marginBottom:'0.5rem', color:'#aab8d8' }}><Ic d={ICONS.pen} size={34} /></div>
                עדיין אין רשומות · התחל לכתוב!
              </div>
            )}
            {journal.map((entry, idx) => (
              <div key={entry.id} className="journal-entry">
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'0.45rem' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.55rem' }}>
                    <span style={{ background:'#eef1ff', color:'#2e4080', fontFamily:"'Frank Ruhl Libre',serif", fontWeight:700, fontSize:'0.78rem', padding:'0.08rem 0.4rem', borderRadius:6 }}>{idx+1}</span>
                    <span style={{ fontSize:'0.7rem', color:'#5f6e8e' }}>{entry.date}</span>
                  </div>
                  <div className="entry-actions">
                    <button className="entry-btn" aria-label="ערוך רשומה" title="ערוך" onClick={() => { setEditingId(entry.id); setEditText(entry.text); }}>✏️</button>
                    <button className="entry-btn del" aria-label="מחק רשומה" title="מחק" onClick={() => { if (confirm('למחוק את הרשומה?')) deleteEntry(entry.id); }}>🗑</button>
                  </div>
                </div>
                {editingId === entry.id ? (
                  <div>
                    <textarea value={editText} onChange={e => setEditText(e.target.value)} aria-label="עריכת רשומה" autoFocus
                      style={{ width:'100%', minHeight:75, background:'#f2f5fc', border:'1.5px solid #d8e0f0', borderRadius:8, color:'#1a2340', fontFamily:"'Heebo',sans-serif", fontSize:'0.88rem', padding:'0.65rem', resize:'vertical', direction:'rtl' }} />
                    <div style={{ display:'flex', gap:'0.5rem', marginTop:'0.5rem', justifyContent:'flex-end' }}>
                      <button onClick={() => setEditingId(null)} style={{ background:'#eef1ff', border:'1px solid #d8e0f0', color:'#3a4f7a', padding:'0.32rem 0.75rem', borderRadius:7, cursor:'pointer', fontSize:'0.8rem', fontFamily:"'Heebo',sans-serif" }}>ביטול</button>
                      <button onClick={() => saveEdit(entry.id)} style={{ background:'#2a40a0', color:'#fff', border:'none', padding:'0.32rem 0.85rem', borderRadius:7, cursor:'pointer', fontSize:'0.8rem', fontFamily:"'Heebo',sans-serif", fontWeight:700 }}>שמור</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ fontSize:'0.9rem', lineHeight:1.72, color:'#1a2340', whiteSpace:'pre-wrap' }}>{entry.text}</div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
      <footer style={{ textAlign:"right", padding:"0.5rem 1.5rem calc(0.8rem + env(safe-area-inset-bottom))", fontSize:"0.72rem", color:"#5f6e8e", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:"0.3rem" }}>
        <span style={{ display:"inline-flex", alignItems:"center", gap:"0.6rem", flexWrap:"wrap" }}>
          נוצר ע"י עמיחי צדוק
          <a href={'mailto:amichai85@gmail.com?subject=' + encodeURIComponent('משוב על מעקב הש״ס')} style={{ display:"inline-flex", alignItems:"center", gap:"0.3rem", color:"#3d5499", textDecoration:"none", background:"#eef2f9", borderRadius:99, padding:"0.18rem 0.6rem", fontWeight:600 }}>
            <Ic d={ICONS.mail} size={11} /> צור קשר
          </a>
          <span>· קישורי החברותא באדיבות <a href="https://daf-yomi.com" target="_blank" rel="noopener noreferrer" style={{ color:"#0f766e", textDecoration:"none", fontWeight:600 }}>פורטל הדף היומי</a></span>
          <a href="privacy.html" style={{ color:"#5f6e8e" }}>מדיניות פרטיות</a>
          <button onClick={deleteAccount} style={{ background:"none", border:"none", color:"#8b2020", font:"inherit", cursor:"pointer", textDecoration:"underline", padding:0 }}>מחיקת חשבון</button>
        </span>
        <span dir="ltr">{APP_VERSION}</span>
      </footer>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // בביקור הראשון אין עדיין SW — השתלטות שלו היא לא "גרסה חדשה" ולא צריך לרענן
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(e => console.warn('SW', e));
      // גרסה חדשה השתלטה — לא מרעננים באמצע עבודה (טיוטה ביומן וכו׳), אלא מציעים לרענן
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || window._swUpdated) return;
        window._swUpdated = true;
        window.dispatchEvent(new Event('shas-update'));
      });
    });
  }
</script>
</body>
</html>
