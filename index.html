function todayDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function calcStreak(sd) {
  if (!sd || !sd.date) return 0;
  const todayStr = todayDateStr();
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const yStr = yd.getFullYear() + '-' + String(yd.getMonth()+1).padStart(2,'0') + '-' + String(yd.getDate()).padStart(2,'0');
  return (sd.date === todayStr || sd.date === yStr) ? (sd.count || 1) : 0;
}

let _dyCache = null;
function getTodayDafYomi() {
  if (_dyCache) return _dyCache;
  const START = new Date(2020, 0, 5); // מחזור י"ד התחיל 5.1.2020
  const dayNum = Math.floor((new Date() - START) / 86400000);
  const list = [];
  for (const name of DAF_YOMI_ORDER) {
    const t = SHAS.flatMap(s => s.tractates).find(tr => tr.name === name);
    if (!t) continue;
    for (let d = 2; d <= t.dafim + 1; d++) list.push({ tractate: name, daf: d });
  }
  _dyCache = dayNum >= 0 ? (list[dayNum % list.length] || null) : null;
  return _dyCache;
}

async function fbSave(uid, key, val) {
  // מגן גלובלי: אסור לכתוב לענן לפני שטעינת הנתונים הצליחה
  if (!window._shasDataLoaded) { console.warn('fbSave blocked — data not loaded yet:', key); return; }
  try {
    const { db, doc, setDoc } = window._fb;
    const stored = typeof val === 'string' ? val : JSON.stringify(val);
    await setDoc(doc(db, 'users', uid), { [key]: stored }, { merge: true });
  } catch(e) { console.error('save error', e); }
}
async function fbLoad(uid) {
  try {
    // קריאה מהשרת בלבד — מטמון מקומי ריק/ישן עלול להיראות כמו "אין נתונים"
    const { db, doc, getDocFromServer } = window._fb;
    const snap = await getDocFromServer(doc(db, 'users', uid));
    if (snap.exists()) return snap.data();
    return {}; // המסמך לא קיים — משתמש חדש
  } catch(e) {
    console.error('load error', e);
    if (e.code === 'permission-denied') {
      alert('⚠️ אין הרשאה לקרוא את הנתונים מ-Firebase.\nיש לעדכן את כללי האבטחה ב-Firebase Console (Firestore → Rules).');
    }
  }
  return null; // טעינה נכשלה — אסור לדרוס את הענן
}

// מיזוג union — מוסיף מפתחות מהשרת שאין מקומית, ולוקח את הספירה הגבוהה (חזרות).
// לעולם לא מוחק סימון — כך שסימון שנעשה במכשיר אחר לא נעלם. מחזיר null אם אין שינוי.
function mergeInto(local, server) {
  if (!server || typeof server !== 'object') return null;
  let changed = false;
  const out = { ...local };
  for (const k in server) {
    if (!(k in out)) { out[k] = server[k]; changed = true; }
    else if (typeof server[k] === 'number' && typeof out[k] === 'number' && server[k] > out[k]) { out[k] = server[k]; changed = true; }
  }
  return changed ? out : null;
}

// תאריך עברי בגימטריה לתצוגה — כ״ט אדר א׳ תשפ״ו
function fmtHebDate(o) {
  try {
    const hebcal = window.Hebcal || window.hebcal;
    const hd = new hebcal.HDate(new Date(o.date));
    return hd.renderGematriya ? hd.renderGematriya(true) : hd.render('he');
  } catch(e) {}
  if (o.hebrewLabel) return o.hebrewLabel;
  try { return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day:'numeric', month:'long', year:'numeric' }).format(new Date(o.date)); } catch(e) { return new Date(o.date).toLocaleDateString('he-IL'); }
}

// מחשב את יום ההולדת העברי בשנה נתונה (לועזית)
function hebrewBirthdayInYear(birthDate, targetYear) {
  try {
    const hebcal = window.Hebcal || window.hebcal;
    if (!hebcal) return null;
    const birthHeb = new hebcal.HDate(birthDate);
    // יום הולדת עברי בשנה העברית המתאימה
    const targetGregorianApprox = new Date(targetYear, 5, 1); // אמצע השנה
    const targetHebYear = new hebcal.HDate(targetGregorianApprox).getFullYear();
    const bdayThisYear = new hebcal.HDate(birthHeb.getDate(), birthHeb.getMonth(), targetHebYear);
    return { hebrew: bdayThisYear.renderGematriya ? bdayThisYear.renderGematriya(true) : bdayThisYear.render('he'), gregorian: bdayThisYear.greg() };
  } catch(e) { return null; }
}

                                  const isL = !!learned[k];
                                  const dy = getTodayDafYomi();
                                  const isDY = dy && dy.tractate === t.name && dy.daf === daf;
                                  return (
                                    <div key={k} className={'amud-cell' + (isL ? ' learned' : '') + (flash === k ? ' flash' : '') + (reviewsMode[t.name] && isL && !hardMode[t.name] ? ' review-mode' : '') + (hardMode[t.name] && isL ? ' hard-mode' : '') + (isDY ? ' daf-yomi' : '')}
                                      onClick={() => hardMode[t.name] ? toggleHard(t.name, daf, amud) : reviewsMode[t.name] ? toggleReview(t.name, daf, amud) : toggleAmud(t.name, daf, amud)}>
                                      {isL && reviews[k] > 0 && <span style={{ position:'absolute', top:2, left:2, background:'#e8c040', color:'#1a2340', fontSize:'0.48rem', fontWeight:900, width:13, height:13, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', lineHeight:1, fontFamily:'sans-serif' }}>{reviews[k]}</span>}
                                      {isL && hard[k] && <div style={{ position:'absolute', bottom:0, left:0, right:0, height:3, background:'#ef4444', borderRadius:'0 0 5px 5px', pointerEvents:'none' }} />}
                                      <span className="daf-num">{HEB[daf]}</span>
                                      <span className="amud-letter">{amud}</span>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          </div>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>}

        {tab === 'target' && (() => {
          const targetObj = targetDate ? (() => { try { return JSON.parse(targetDate); } catch(e) { return null; } })() : null;
          const birthDateObj = (birthInput && birthInput.split('-').filter(Boolean).length === 3) ? new Date(birthInput) : null;
          const targetYear = birthDateObj ? birthDateObj.getFullYear() + Number(ageInput) : null;
          const bdayResult = (birthDateObj && ageInput) ? hebrewBirthdayInYear(birthDateObj, targetYear) : null;
          const computedDate = bdayResult ? bdayResult.gregorian : null;
          const hebrewDate = bdayResult ? bdayResult.hebrew : null;
          return (
          <div style={{ maxWidth:500, margin:'0 auto' }}>
            <div style={{ background:'#fff', border:'1.5px solid #d8e0f0', borderRadius:16, padding:'2rem', boxShadow:'0 2px 12px rgba(30,45,90,0.08)', textAlign:'center' }}>
              <div style={{ marginBottom:'0.8rem', color:'#2a40a0', display:'flex', justifyContent:'center' }}><Ic d={ICONS.target} size={42} /></div>
              <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.3rem', fontWeight:700, color:'#2e4080', marginBottom:'0.3rem' }}>
                באיזה גיל היית רוצה לסיים את הש״ס?
              </div>
              <div style={{ fontSize:'0.82rem', color:'#7a8aaa', marginBottom:'1.8rem' }}>
                {targetObj ? 'תמיד אפשר לעדכן' : 'נחשב יחד את הקצב הנדרש'}
              </div>
              {targetObj && (
                <div style={{ background:'#eef1ff', border:'1.5px solid #c0ccf0', borderRadius:12, padding:'1rem', marginBottom:'1.5rem' }}>
                  <div style={{ fontSize:'0.75rem', color:'#5a70aa', marginBottom:'0.3rem' }}>היעד שלך</div>
                  <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.3rem', fontWeight:700, color:'#2a40a0' }}>
                    סיום עד גיל {targetObj.age}
                  </div>
                  <div style={{ fontSize:'0.82rem', color:'#5a70aa', marginTop:'0.2rem' }}>
                    {fmtHebDate(targetObj)}
                  </div>
                </div>
              )}
              <div style={{ display:'flex', flexDirection:'column', gap:'1rem', marginBottom:'1.2rem', textAlign:'right' }}>
                <div>
                  <div style={{ fontSize:'0.8rem', color:'#5a70aa', marginBottom:'0.3rem', fontWeight:600 }}>גיל יעד לסיום</div>
                  <input type="number" min="20" max="120" value={ageInput} onChange={e => setAgeInput(e.target.value)}
                    placeholder="למשל: 50"
                    style={{ width:'100%', border:'1.5px solid #d8e0f0', borderRadius:8, padding:'0.65rem 0.9rem', fontFamily:"'Heebo',sans-serif", fontSize:'1rem', color:'#1a2340', textAlign:'center', boxSizing:'border-box' }}
                  />
                </div>
                <div>
                  <div style={{ fontSize:'0.8rem', color:'#5a70aa', marginBottom:'0.3rem', fontWeight:600 }}>תאריך לידה</div>
                  <div style={{ display:'flex', gap:'0.5rem', direction:'rtl' }}>
                    <select value={birthInput.split('-')[2] || ''} onChange={e => {
                      const parts = birthInput.split('-');
                      setBirthInput((parts[0]||'2000') + '-' + (parts[1]||'01') + '-' + e.target.value.padStart(2,'0'));
                    }} style={{ flex:1, border:'1.5px solid #d8e0f0', borderRadius:8, padding:'0.6rem 0.4rem', fontFamily:"'Heebo',sans-serif", fontSize:'0.95rem', color:'#1a2340' }}>
                      <option value="">יום</option>
                      {Array.from({length:31},(_,i)=>i+1).map(d => <option key={d} value={String(d).padStart(2,'0')}>{d}</option>)}
                    </select>
                    <select value={birthInput.split('-')[1] || ''} onChange={e => {
                      const parts = birthInput.split('-');
                      setBirthInput((parts[0]||'2000') + '-' + e.target.value + '-' + (parts[2]||'01'));
                    }} style={{ flex:2, border:'1.5px solid #d8e0f0', borderRadius:8, padding:'0.6rem 0.4rem', fontFamily:"'Heebo',sans-serif", fontSize:'0.95rem', color:'#1a2340' }}>
                      <option value="">חודש</option>
                      {['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'].map((mn,i) => <option key={i+1} value={String(i+1).padStart(2,'0')}>{mn}</option>)}
                    </select>
                    <select value={birthInput.split('-')[0] || ''} onChange={e => {
                      const parts = birthInput.split('-');
                      setBirthInput(e.target.value + '-' + (parts[1]||'01') + '-' + (parts[2]||'01'));
                    }} style={{ flex:2, border:'1.5px solid #d8e0f0', borderRadius:8, padding:'0.6rem 0.4rem', fontFamily:"'Heebo',sans-serif", fontSize:'0.95rem', color:'#1a2340' }}>
                      <option value="">שנה</option>
                      {Array.from({length:80},(_,i)=>2010-i).map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                  </div>
                </div>
              </div>
              {computedDate && (
                <div style={{ fontSize:'0.85rem', color:'#3a4f7a', marginBottom:'1.2rem', background:'#f7f9ff', borderRadius:8, padding:'0.6rem' }}>
                  תאריך יעד מחושב: <strong>{hebrewDate}</strong>
                </div>
              )}
              <button onClick={async () => {
                if (!ageInput || !birthInput) return;
                const birthDateObjSave = new Date(birthInput);
                const targetYearSave = birthDateObjSave.getFullYear() + Number(ageInput);
                const bdaySave = hebrewBirthdayInYear(birthDateObjSave, targetYearSave);
                const d = bdaySave ? bdaySave.gregorian : new Date(birthDateObjSave.getFullYear() + Number(ageInput), birthDateObjSave.getMonth(), birthDateObjSave.getDate());
                const obj = { age: Number(ageInput), birth: birthInput, date: d.toISOString(), hebrewLabel: bdaySave ? bdaySave.hebrew : null };
                const val = JSON.stringify(obj);
                setTargetDate(val); setTargetInput(val);
                await fbSave(user.uid, 'shas-target', val);
                setTab('shas');
              }} style={{ background:'#2a40a0', color:'#fff', border:'none', borderRadius:8, padding:'0.7rem 2rem', fontFamily:"'Heebo',sans-serif", fontWeight:700, fontSize:'0.95rem', cursor:'pointer', width:'100%', marginBottom:'0.8rem' }}>
                {targetObj ? 'עדכן יעד' : 'הגדר יעד'}
              </button>
              {targetObj && (
                <button onClick={async () => {
                  setTargetDate(null); setTargetInput(''); setAgeInput(''); setBirthInput('');
                  await fbSave(user.uid, 'shas-target', '');
                }} style={{ background:'none', border:'none', color:'#aab4cc', fontSize:'0.72rem', cursor:'pointer', fontFamily:"'Heebo',sans-serif" }}>
                  הסר יעד
                </button>
              )}
            </div>
          </div>
          );
        })()}

        {tab === 'journal' && (
          <div style={{ maxWidth:660, margin:'0 auto' }}>
            <div style={{ marginBottom:'1.2rem' }}>
              <div style={{ fontFamily:"'Frank Ruhl Libre',serif", fontSize:'1.15rem', fontWeight:700, color:'#2e4080', marginBottom:'0.2rem' }}>יומן למידה</div>
              <div style={{ fontSize:'0.8rem', color:'#7a8aaa' }}>רשום היכן הגעת, מה חידשת, מה רצית לזכור</div>
            </div>
            <div style={{ background:'#fff', border:'1.5px solid #d8e0f0', borderRadius:12, padding:'1rem', marginBottom:'1.2rem', boxShadow:'0 2px 8px rgba(30,45,90,0.06)' }}>
              <textarea value={newEntry} onChange={e => setNewEntry(e.target.value)}
                placeholder={"הגעתי עד...\nחידוש שראיתי...\nרעיון שרציתי לזכור..."}
                style={{ width:'100%', minHeight:85, background:'#f2f5fc', border:'1.5px solid #d8e0f0', borderRadius:8, color:'#1a2340', fontFamily:"'Heebo',sans-serif", fontSize:'0.9rem', padding:'0.75rem', resize:'vertical', direction:'rtl', lineHeight:1.65 }}
              />
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'0.6rem' }}>
                <span style={{ fontSize:'0.7rem', color:'#7a8aaa' }}>היום: {today()}</span>
                <button onClick={addEntry} style={{ background:'#2a40a0', color:'#fff', border:'none', borderRadius:8, padding:'0.48rem 1.1rem', fontFamily:"'Heebo',sans-serif", fontWeight:700, fontSize:'0.85rem', cursor:'pointer' }}>+ הוסף</button>
              </div>
            </div>
            {journal.length === 0 && (
              <div style={{ textAlign:'center', color:'#7a8aaa', padding:'2.5rem', fontSize:'0.88rem' }}>
                <div style={{ marginBottom:'0.5rem', color:'#aab8d8' }}><Ic d={ICONS.pen} size={34} /></div>
                עדיין אין רשומות · התחל לכתוב!
              </div>
            )}
            {journal.map((entry, idx) => (
              <div key={entry.id} className="journal-entry">
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'0.45rem' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.55rem' }}>
                    <span style={{ background:'#eef1ff', color:'#2e4080', fontFamily:"'Frank Ruhl Libre',serif", fontWeight:700, fontSize:'0.78rem', padding:'0.08rem 0.4rem', borderRadius:6 }}>{idx+1}</span>
                    <span style={{ fontSize:'0.7rem', color:'#7a8aaa' }}>{entry.date}</span>
                  </div>
                  <div className="entry-actions">
                    <button className="entry-btn" onClick={() => { setEditingId(entry.id); setEditText(entry.text); }}>✏️</button>
                    <button className="entry-btn del" onClick={() => deleteEntry(entry.id)}>🗑</button>
                  </div>
                </div>
                {editingId === entry.id ? (
                  <div>
                    <textarea value={editText} onChange={e => setEditText(e.target.value)}
                      style={{ width:'100%', minHeight:75, background:'#f2f5fc', border:'1.5px solid #d8e0f0', borderRadius:8, color:'#1a2340', fontFamily:"'Heebo',sans-serif", fontSize:'0.88rem', padding:'0.65rem', resize:'vertical', direction:'rtl' }} />
                    <div style={{ display:'flex', gap:'0.5rem', marginTop:'0.5rem', justifyContent:'flex-end' }}>
                      <button onClick={() => setEditingId(null)} style={{ background:'#eef1ff', border:'1px solid #d8e0f0', color:'#3a4f7a', padding:'0.32rem 0.75rem', borderRadius:7, cursor:'pointer', fontSize:'0.8rem', fontFamily:"'Heebo',sans-serif" }}>ביטול</button>
                      <button onClick={() => saveEdit(entry.id)} style={{ background:'#2a40a0', color:'#fff', border:'none', padding:'0.32rem 0.85rem', borderRadius:7, cursor:'pointer', fontSize:'0.8rem', fontFamily:"'Heebo',sans-serif", fontWeight:700 }}>שמור</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ fontSize:'0.9rem', lineHeight:1.72, color:'#1a2340', whiteSpace:'pre-wrap' }}>{entry.text}</div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ textAlign:"right", padding:"0.5rem 1.5rem", fontSize:"0.65rem", color:"#aab4cc", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:"0.3rem" }}>
        <span style={{ display:"inline-flex", alignItems:"center", gap:"0.6rem" }}>
          נוצר ע"י עמיחי צדוק
          <a href={'mailto:amichai85@gmail.com?subject=' + encodeURIComponent('משוב על מעקב הש״ס')} style={{ display:"inline-flex", alignItems:"center", gap:"0.3rem", color:"#5a70aa", textDecoration:"none", background:"#eef2f9", borderRadius:99, padding:"0.18rem 0.6rem", fontWeight:600 }}>
            <Ic d={ICONS.mail} size={11} /> צור קשר
          </a>
        </span>
        <span dir="ltr">{APP_VERSION} · {user?.email || ''} · {(user?.uid || '').slice(0,6)} · {totalLearned}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/shas-tracker/sw.js', { scope: '/shas-tracker/' })
        .then(reg => reg.update());
      // כשגרסה חדשה משתלטת — רענון אוטומטי (פעם אחת, בלי לולאה)
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
